version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Core UI (Angular)
  - package-ecosystem: "npm"
    directory: "/src/ui"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Core Server (Python)
  - package-ecosystem: "pip"
    directory: "/src/server/package"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Custom Element NPM Package
  - package-ecosystem: "npm"
    directory: "/src/ui/custom_element_npm"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # UI Demos (npm)
  - package-ecosystem: "npm"
    directory: "/src/custom_element_demos/angular"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/src/custom_element_demos/nextjs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/src/custom_element_demos/vanilla_ts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Example Python Adapters (pip)
  - package-ecosystem: "pip"
    directory: "/src/example_adapters/graphviz_dot_adapter"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/src/example_adapters/my_adapter"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/src/example_node_data_providers/my_ndp"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
