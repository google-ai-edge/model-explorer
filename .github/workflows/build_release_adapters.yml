# YAML schema for GitHub Actions:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#

name: Build and Release Adapters

on:
  workflow_dispatch:
    inputs:
      REFRESH_CACHE:
        description: "Force refresh Bazel disk cache"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: "Build Wheel (${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        runner: [linux-x86-n2-16, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src/builtin-adapter
    permissions:
      actions: write  # For gh cache delete
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REFRESH_CACHE: ${{ inputs.REFRESH_CACHE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install wheel

      - name: Set up cache keys
        id: cache-keys
        env:
          RUNNER_NAME: ${{ matrix.runner }}
        run: |
          CACHE_RESTORE_KEY_2="${GITHUB_WORKFLOW}-${RUNNER_NAME}"
          CACHE_RESTORE_KEY_1="${CACHE_RESTORE_KEY_2}-${{ hashFiles('**/WORKSPACE', '**/.bazelrc') }}"
          CACHE_RESTORE_KEY_0="${CACHE_RESTORE_KEY_1}-${{ hashFiles('**/BUILD*') }}"
          CACHE_KEY="${CACHE_RESTORE_KEY_0}-${GITHUB_SHA}"
          echo "CACHE_RESTORE_KEY_2=${CACHE_RESTORE_KEY_2}" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_1=${CACHE_RESTORE_KEY_1}" >> "$GITHUB_OUTPUT"
          echo "CACHE_RESTORE_KEY_0=${CACHE_RESTORE_KEY_0}" >> "$GITHUB_OUTPUT"
          echo "CACHE_KEY=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Clean build outputs if cache is being refreshed
        if: env.REFRESH_CACHE == 'true'
        run: bazel clean --expunge

      - name: Restore bazel cache
        id: bazel-cache
        if: env.REFRESH_CACHE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_0 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_1 }}-
            ${{ steps.cache-keys.outputs.CACHE_RESTORE_KEY_2 }}-

      - name: Check cache hit
        env:
          CACHE_HIT: ${{ steps.bazel-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.bazel-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}
        run: |
          echo "Cache Hit: ${CACHE_HIT}"
          echo "Cache Primary Key: ${CACHE_PRIMARY_KEY}"
          echo "Cache Matched Key: ${CACHE_MATCHED_KEY}"

      - name: Bazel build Python wheel package
        env:
          RUNNER_NAME: ${{ matrix.runner }}
        run: |
          BAZEL_FLAGS="--disk_cache=$HOME/.cache/bazel --repository_cache=$HOME/.cache/bazel/repo --config=public_cache -c opt"
          if [[ "${RUNNER_NAME}" == "macos-latest" ]]; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --config=macos_arm64 --local_ram_resources=9216 --jobs=3 --copt=-O1"
          fi
          bazel build ${BAZEL_FLAGS} //python/ai_edge_model_explorer_adapter:wheel

      - name: Test wheel installation and FFI smoke test
        run: |
          pip install bazel-bin/python/ai_edge_model_explorer_adapter/*.whl
          python3 -c "import ai_edge_model_explorer_adapter as adapter; print('Adapter loaded successfully:', adapter.VisualizeConfig())"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-edge-model-explorer-adapter-${{ matrix.runner }}
          path: src/builtin-adapter/bazel-bin/python/ai_edge_model_explorer_adapter/*.whl
          if-no-files-found: error

      - name: Remove stale cache if cache is being refreshed
        if: env.REFRESH_CACHE == 'true'
        continue-on-error: true
        env:
          TARGET_CACHE_KEY: ${{ steps.cache-keys.outputs.CACHE_KEY }}
        run: gh cache delete "${TARGET_CACHE_KEY}"

      - name: Save bazel cache if refreshing
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.REFRESH_CACHE == 'true'
        with:
          path: ~/.cache/bazel
          key: ${{ steps.cache-keys.outputs.CACHE_KEY }}
