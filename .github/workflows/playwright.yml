# YAML schema for GitHub Actions:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/

name: Playwright Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string

jobs:
  test:
    name: Local Build & Test
    timeout-minutes: 12
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'

      - name: Build from latest UI source code
        # zizmor: ignore[adhoc-packages]
        run: |
          cd src/ui
          npm install -g @angular/cli
          npm install
          ./scripts/build_and_update_python_package.sh

      - name: Turn up local server
        run: |
          cd src/server
          ./scripts/setup_local_dev.sh
          nohup model-explorer --host=127.0.0.1 --port=8080 &

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest-playwright pillow
          python -m playwright install --with-deps

      - name: Run tests
        run: |
          pytest -v ci/playwright_test.py

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: playwright-screenshots
          path: build/


