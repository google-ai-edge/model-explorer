# YAML schema for GitHub Actions:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/

name: Playwright Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string

jobs:
  test:
    name: Local Build & Test
    timeout-minutes: 12
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'

      - name: Build from latest UI source code
        # zizmor: ignore[adhoc-packages]
        run: |
          cd src/ui
          npm install -g @angular/cli
          npm install
          ./scripts/build_and_update_python_package.sh

      - name: Turn up local server
        run: |
          cd src/server
          ./scripts/setup_local_dev.sh
          nohup model-explorer --host=127.0.0.1 --port=8080 &

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest-playwright pillow
          python -m playwright install --with-deps

      - name: Run tests
        run: |
          pytest -v ci/playwright_test.py

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: playwright-screenshots
          path: build/
