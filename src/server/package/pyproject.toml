[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-edge-model-explorer"
dynamic = ["version"]
authors = [
  { name="Google LLC", email="opensource@google.com" },
]
description = "A modern model graph visualizer and debugger"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
   "Programming Language :: Python :: 3.9",
   "Programming Language :: Python :: 3.10",
   "Programming Language :: Python :: 3.11",
   "Programming Language :: Python :: 3.12",
   "Programming Language :: Python :: 3.13",
   "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "flask",
  "ipython",
  # Skip on windows.
  "ai-edge-model-explorer-adapter ~= 0.2.0; sys_platform != 'win32'",
  "dacite",
  "packaging",
  "portpicker",
  "requests",
  "termcolor",
  "typing-extensions",
  "numpy",
  "watchdog",
]

[project.optional-dependencies]
# LogicGraph (`model-explorer-hfgraph`) pipeline for running `.hfrun` specs.
# Viewing an existing `.hfgraph` file only needs the base package.
hfgraph = [
  "torch>=2.8; python_version>='3.10'",
  "transformers>=5.0; python_version>='3.10'",
  "pydantic>=2; python_version>='3.10'",
]

[project.scripts]
model-explorer = "model_explorer.cmdline:main"
model-explorer-hfgraph = "model_explorer.hfgraph.cli:main"
model-explorer-hfgraph-view = "model_explorer.hfgraph.view:main"

[tool.setuptools.dynamic]
version = {attr = "model_explorer.__version__"}

# Include all files in "web_app" dir, and the LogicGraph JSON schemas.
[tool.setuptools.package-data]
"model_explorer.web_app" = ["**/*"]
"model_explorer.hfgraph" = ["schema/*.json"]
