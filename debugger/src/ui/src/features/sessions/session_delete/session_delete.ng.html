<h2 mat-dialog-title>Delete session?</h2>
<mat-dialog-content>
  <p>
    Remove <strong>{{ session.name }}</strong> from the session list?
  </p>
  <p>Captured files are retained. You can undo this action.</p>
  @if (error()) {
    <p role="alert" tabindex="-1">{{ error() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [disabled]="saving()" mat-dialog-close>Cancel</button>
  <button mat-button [disabled]="saving()" (click)="remove()">
    {{ saving() ? 'Deleting…' : 'Delete' }}
  </button>
</mat-dialog-actions>
