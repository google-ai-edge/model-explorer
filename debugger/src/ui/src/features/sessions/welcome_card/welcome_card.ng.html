<section class="welcome" aria-labelledby="welcome-title">
  <button
    type="button"
    class="dismiss"
    aria-label="Dismiss welcome"
    matTooltip="Dismiss"
    (click)="dismiss()"
  >
    <mat-icon>close</mat-icon>
  </button>
  <div class="left">
    <h1 id="welcome-title">Welcome to Model Debugger</h1>
    <p>Compare runtime outputs and inspect model execution, layer predictions and KV caches.</p>
    <div class="doc-link">
      <a href="https://github.com/google-ai-edge/model-explorer" target="_blank" rel="noopener"
        ><mat-icon aria-hidden="true">open_in_new</mat-icon
        ><span class="doc-text">Learn more from GitHub</span></a
      >
    </div>
  </div>
</section>
