<div class="context" aria-label="Model, phase and selected analysis object">
  <span class="model-name">{{ modelName() }}</span
  ><span aria-hidden="true">/</span>
  <span>{{ stage() === 'prefill' ? 'Prefill' : 'Decode' }}</span>
  @if (selectedObject(); as item) {
    <span aria-hidden="true">/</span><span class="selected-label">{{ item.label }}</span>
  }
</div>
<div
  class="canvas"
  [class.has-selection]="!!selectedObject()"
  (pointerdown)="startBlank($event)"
  (pointerup)="endBlank($event)"
  (pointercancel)="cancelBlank()"
  (pointerleave)="cancelBlank()"
>
  <svg
    class="architecture"
    [attr.viewBox]="stage() === 'decode' ? '0 0 430 382' : '0 0 430 245'"
    role="group"
    aria-label="Model architecture"
  >
    <g class="wires" aria-hidden="true">
      @for (path of spine(); track path) {
        <path [attr.d]="path" />
      }
      @for (module of modules(); track module.id) {
        <path class="arrow" [attr.d]="'M132 ' + (module.y - 5) + 'l3 5 3-5Z'" />
      }
      @for (branch of branches(); track branch.kind) {
        <g [class.related]="selected() === branch.kind">
          <path class="observation" [attr.d]="branch.d" />
          <path
            class="arrow"
            [attr.d]="'M' + (branch.x - 6) + ' ' + (branch.y - 3) + 'l2 3-2 3 6-3Z'"
          />
          @if (branch.kind === 'kv' && stage() === 'decode') {
            <path class="arrow" d="M244 127l-2 3 2 3-6-3Z" />
          }
        </g>
      }
      @if (stage() === 'decode') {
        <path d="M115 347H40Q24 347 24 331V41Q24 25 40 25H120" />
        <path class="arrow" d="M114 22l2 3-2 3 6-3Z" />
        <path class="arrow" d="M132 329l3 5 3-5Z" />
      }
    </g>
    @for (module of modules(); track module.id) {
      <g
        data-node="module"
        [attr.data-module]="module.id"
        class="module"
        [class.related]="selectedObject()?.module === module.id"
        [attr.transform]="'translate(' + module.x + ',' + module.y + ')'"
      >
        @if (module.id === 'layers') {
          <rect
            class="stack"
            x="8"
            y="-8"
            [attr.width]="module.width"
            [attr.height]="module.height"
            rx="6"
          />
          <rect
            class="stack"
            x="4"
            y="-4"
            [attr.width]="module.width"
            [attr.height]="module.height"
            rx="6"
          />
        }
        <rect
          class="module-face"
          [attr.width]="module.width"
          [attr.height]="module.height"
          rx="6"
        />
        <path class="fold" d="M8 11l3 3 3-3M8 21l3-3 3 3" aria-hidden="true" />
        <text [attr.x]="module.width / 2" y="17" dominant-baseline="middle" text-anchor="middle">
          {{ module.label }}
        </text>
        @for (item of objects(); track item.kind) {
          @if (item.insideModule && item.module === module.id) {
            <foreignObject
              [attr.x]="item.x"
              [attr.y]="item.y"
              [attr.width]="module.width - 20"
              height="32"
            >
              <ng-container
                [ngTemplateOutlet]="analysisObject"
                [ngTemplateOutletContext]="{$implicit: item, reason: unavailable()[item.kind]}"
              />
            </foreignObject>
          }
        }
      </g>
    }
    <g class="token" data-node="token">
      @if (stage() === 'decode') {
        <rect x="120" y="12" width="30" height="26" rx="7" />
        <text x="135" y="29" text-anchor="middle">xₜ</text>
        <text class="caption" x="158" y="29">New token</text>
        <rect x="115" y="334" width="40" height="26" rx="7" />
        <text x="135" y="351" text-anchor="middle">xₜ₊₁</text>
        <text class="caption" x="163" y="351">Next token</text>
      } @else {
        <rect x="80" y="12" width="28" height="26" rx="7" />
        <text x="94" y="29" text-anchor="middle">x₁</text>
        <rect x="113" y="12" width="28" height="26" rx="7" />
        <text x="127" y="29" text-anchor="middle">x₂</text>
        <text x="151" y="29" text-anchor="middle">…</text>
        <rect x="161" y="12" width="28" height="26" rx="7" />
        <text x="175" y="29" text-anchor="middle">xₙ</text>
        <text class="caption" x="197" y="29">Prompt tokens</text>
      }
    </g>
    @for (item of objects(); track item.kind) {
      @if (!item.insideModule) {
        <foreignObject [attr.x]="item.x" [attr.y]="item.y" width="152" height="32">
          <ng-container
            [ngTemplateOutlet]="analysisObject"
            [ngTemplateOutletContext]="{$implicit: item, reason: unavailable()[item.kind]}"
          />
        </foreignObject>
      }
    }
  </svg>
</div>
<ng-template #analysisObject let-item let-reason="reason">
  <button
    type="button"
    data-node="object"
    class="analysis-object"
    [class.selected]="selected() === item.kind"
    [class.unavailable]="!!reason"
    [attr.aria-label]="'Analyze ' + item.label"
    [attr.aria-pressed]="selected() === item.kind"
    [attr.title]="reason || item.label"
    (click)="selectionChange.emit(item.kind)"
  >
    <svg class="check" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="7" />
      @if (selected() === item.kind) {
        <path d="m6.5 10 2.4 2.5 4.7-5" />
      }</svg
    ><span>{{ item.label }}</span>
  </button>
</ng-template>
<div class="legend" aria-label="Graph legend">
  <span
    ><i aria-hidden="true"
      ><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /></svg></i
    >Unselected analysis object</span
  >
  <span
    ><i class="selected" aria-hidden="true"
      ><svg viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="7" />
        <path d="m6.5 10 2.4 2.5 4.7-5" /></svg></i
    >Selected analysis object</span
  >
</div>
@if (selectedObject(); as item) {
  @if (unavailable()[item.kind]; as reason) {
    <p class="availability" role="status">{{ reason }}</p>
  }
}
