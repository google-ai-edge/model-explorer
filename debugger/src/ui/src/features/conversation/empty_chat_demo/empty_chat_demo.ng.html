<section
  class="inPlaceDemo"
  aria-label="Illustration of one conversation round sent to both runtimes"
>
  <div class="demoContext">
    <div class="demoLanes">
      @for (side of ['ref', 'target']; track side) {
        <div class="demoSide">
          <div class="demoPrompt">
            <span class="demoRole">User</span>
            <div class="demoBar">What's the capital of france?</div>
          </div>
          <div class="demoAnswer">
            <div class="demoBar">
              The capital of France is Paris<span class="exampleDiff">{{
                side === 'ref' ? '.' : ', its largest city.'
              }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
  <span class="demoDraftText" aria-hidden="true">What's the capital of france?</span>
</section>
