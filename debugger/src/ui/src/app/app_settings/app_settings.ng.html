<header>
  <h2 mat-dialog-title>Advanced settings</h2>
  <p>Settings are stored in current browser's local storage</p>
</header>
<mat-dialog-content
  ><label id="welcome-setting-label">Show welcome card</label>
  <div class="switch-line">
    <mat-slide-toggle
      aria-labelledby="welcome-setting-label"
      [checked]="preferences.showWelcome()"
      (change)="preferences.setShowWelcome($event.checked)" /></div
></mat-dialog-content>
<mat-dialog-actions align="end"
  ><button mat-button mat-dialog-close>Close</button></mat-dialog-actions
>
