<button
  class="first-result"
  [attr.aria-label]="firstLabel()"
  [matTooltip]="firstLabel()"
  [disabled]="state().firstDisabled"
  (click)="first.emit()"
>
  <span class="button-icon" aria-hidden="true">first_page</span></button
><button
  [attr.aria-label]="previousLabel()"
  [matTooltip]="previousLabel()"
  [disabled]="state().previousDisabled"
  (click)="previous.emit()"
>
  <span class="button-icon" aria-hidden="true">chevron_left</span>
</button>
@if (countAction()) {
  <button
    class="result-count"
    [attr.aria-label]="countLabel() || state().label"
    [matTooltip]="countTooltip()"
    [attr.aria-expanded]="countExpanded()"
    [attr.aria-controls]="countControls()"
    (click)="count.emit()"
  >
    <span aria-live="polite">{{ state().label }}</span>
  </button>
} @else {
  <span class="result-count" aria-live="polite">{{ state().label }}</span>
}
<button
  [attr.aria-label]="nextLabel()"
  [matTooltip]="nextLabel()"
  [disabled]="state().nextDisabled"
  (click)="next.emit()"
>
  <span class="button-icon" aria-hidden="true">chevron_right</span>
</button>
<ng-content />
