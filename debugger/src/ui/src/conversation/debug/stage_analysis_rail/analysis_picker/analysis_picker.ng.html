@let turn = data.turn;
@let stage = data.stage;
<div class="analysis-dialog">
  <header>
    <h2 mat-dialog-title>Add analysis view</h2>
    <p>Select an analysis object.</p>
  </header>
  <mat-dialog-content>
    <analysis-architecture
      [model]="conversation.state.session()?.model ?? 'Model'"
      [stage]="stage"
      [selected]="analysisPickerKind()"
      [unavailable]="analysisArchitectureUnavailable(turn, stage)"
      (selectionChange)="analysisPickerKind.set($event)"
    />
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button
      mat-button
      [disabled]="
        !analysisPickerOption() ||
        !!panels.analysisUnavailable(turn, stage, analysisPickerOption()!.kind)
      "
      [mat-dialog-close]="analysisPickerKind()"
    >
      Add analysis
    </button>
  </mat-dialog-actions>
</div>
