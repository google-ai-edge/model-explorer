<div class="debug-primary">
  <div class="alignment-field">
    <span>Alignment</span
    ><config-picker
      label="Comparison alignment"
      plural="alignments"
      [compact]="true"
      [popupWidth]="300"
      [value]="conversation.alignment() === 'content' ? 'Context' : 'Steps'"
      [options]="alignmentChoices"
      [descriptions]="alignmentDescriptions"
      (valueChange)="analyses.setAlignment($event === 'Context' ? 'content' : 'steps')"
    />
  </div>
  <div class="debug-find">
    <token-query-control
      #queryControl
      [formula]="tokens.formula()"
      (formulaChange)="tokens.formula.set($event)"
    />
    <find-navigator
      [index]="tokens.resultIndex()"
      [total]="tokens.mismatches().length"
      [pending]="tokens.numericFindPending()"
      [countAction]="true"
      [countLabel]="tokens.findResultLabel()"
      [countTooltip]="tokens.numericFindPending() ? tokens.findResultLabel() : ''"
      (first)="dom.find(0)"
      (previous)="dom.find(-1)"
      (next)="dom.find(1)"
      (count)="queryControl.show()"
    />
  </div>
</div>
