 else if(mappingState.draftSide===d.side){if(mappingState.selected[d.side]?.id===t.id){cancelDraftPair();return;}mappingState.selected={reference:null,target:null,[d.side]:t};}
 else {mappingState.selected[d.side]=t;confirmDraftPair();return;}
 }renderMappingDetails();syncMapping();}});

$('pair-details').addEventListener('click',ev=>{const b=ev.target.closest('[data-info-toggle]');if(!b){const value=ev.target.closest('.info-value');if(value&&(ev.target.closest('[data-value-toggle]')||value.classList.contains('has-overflow')&&!value.classList.contains('expanded'))){const expanded=value.classList.toggle('expanded'),button=value.querySelector('button');button.setAttribute('aria-expanded',String(expanded));button.setAttribute('aria-label',(expanded?'Collapse ':'Expand ')+value.dataset.valueLabel);button.innerHTML=infoIcon(expanded?'fold':'unfold');if(!expanded)measureInfoValues();}return;}const key=b.dataset.infoToggle;closedInfoSections.has(key)?closedInfoSections.delete(key):closedInfoSections.add(key);renderMappingDetails();});

function highlightMappingAnchor(el){
 const anchor=el?.classList.contains('config-entry')?el.dataset.mappingAnchor:null,scope=anchor&&!isModuleArch()?configurationScope(anchor):null;
 $('stage').querySelectorAll('[data-mapping-anchor]').forEach(n=>n.classList.toggle('mapping-hover',!!anchor&&(scope?configurationScope(n.dataset.mappingAnchor)===scope:mappingContext(n.dataset.mappingAnchor).store===mappingContext(anchor).store)));
 $('stage').querySelectorAll('.fork-point').forEach(n=>n.classList.toggle('mapping-hover',!!scope&&configurationScope(n.dataset.tensor)===scope));
}
function focusedConfig(){return document.activeElement?.matches('.config-entry:focus-visible')?document.activeElement:null;}
$('stage').addEventListener('pointerover',ev=>highlightMappingAnchor(ev.target.closest('.config-entry[data-mapping-anchor]')||focusedConfig()));
$('stage').addEventListener('pointerout',ev=>highlightMappingAnchor(ev.relatedTarget?.closest?.('.config-entry[data-mapping-anchor]')||focusedConfig()));

$('stage').addEventListener('focusin',ev=>highlightMappingAnchor(ev.target.closest('.config-entry[data-mapping-anchor]')));
$('stage').addEventListener('focusout',ev=>highlightMappingAnchor(ev.relatedTarget?.closest?.('.config-entry[data-mapping-anchor]')));


const analysisChannel='intermediate-graph-arch';
function publishMappingDetails(){
 if(!mappingState.active)return;
 const c=mappingState.context,list=currentMappingPairs(),selected=mappingState.selected;
 const pair=selected.reference||selected.target?list.find(p=>p.reference.id===selected.reference?.id||p.target.id===selected.target?.id):list.find(p=>p.anchors?.includes(c.anchor));
 const sections=[{label:'Pairing',items:[{label:'Arch output',value:c.label},...(c.configurationScope?[{label:'Range',value:configurationLabel(c.configurationScope)}]:[]),{label:'Stage',value:c.stage==='any'?'Shared lookup':c.stage},{label:'Source',value:'Preview · both sides use the same bundled LiteRT-LM graph; not active-session mapping'},{label:'Metric source',value:'Generated preview values with simulated calculation delay'},{label:'Pairs',value:String(list.length)},{label:'Method',value:list.every(p=>p.origin==='automatic')?'Automatic · identical graph, node and output port':'Includes user-edited pairs'}]}];

 parent.postMessage({channel:analysisChannel,type:'selection',sections},location.origin);
}
function publishDetails(){
 if(mappingState.active){publishMappingDetails();return;}
 const sections=[...$('details').querySelectorAll('.info-section')].map(section=>({
  label:section.querySelector('.info-header>span')?.textContent||'Details',
  tensorItems:[...section.querySelectorAll('[data-tensor-heading]')].map(item=>({label:item.getAttribute('data-tensor-heading'),children:[...item.querySelectorAll('table tr')].map(row=>({label:row.querySelector('td')?.textContent?.replace('▪','').trim()||'',value:row.querySelector('.info-value-text')?.textContent?.trim()||''}))})),
  items:[...section.querySelectorAll('table tr')].map(row=>({label:row.querySelector('td,th')?.textContent?.replace('▪','').trim()||'',value:(row.querySelector('.info-value-text')||row.querySelector('td:last-child'))?.textContent?.trim()||'',shape:row.getAttribute('data-metric-shape')||undefined,metricBg:row.querySelector('[data-metric-bg]')?.getAttribute('data-metric-bg')||undefined,selected:row.getAttribute('data-metric-selected')==='true'})).filter(item=>item.label&&!['model','pairs','runtime mapping'].includes(item.label.toLowerCase()))
 })).filter(section=>section.items.length||section.label==='Tensor Details').map(section=>{const counts=new Map();section.items=section.items.map(item=>{const count=(counts.get(item.label)||0)+1;counts.set(item.label,count);return {...item,label:count>1?item.label+' '+count:item.label};});return section;});
 parent.postMessage({channel:analysisChannel,type:'selection',sections},location.origin);
}
new MutationObserver(publishDetails).observe($('details'),{childList:true,subtree:true});
window.addEventListener('message',event=>{
 if(event.source!==parent||event.origin!==location.origin||event.data?.channel!==analysisChannel)return;
 if(event.data.type==='mapping-action'&&mappingState.active){
  if(event.data.action==='back')closeMapping();
  else if(event.data.action==='confirm')confirmDraftPair();
  else if(event.data.action==='cancel')cancelDraftPair();
  else if(event.data.action==='reset-default')resetMappingDefaults();
  return;
 }
 if(event.data.type==='reset-view'){
  if(mappingState.active){for(const side of ['reference','target'])$('pair-graphs').querySelector(`[data-mapping-pane="${side}"]`)?.contentWindow.postMessage({channel:'mapping-pane-v1',side,type:'reset-view',revision:mappingState.revisions[side]},location.origin);}
  else{closeGraphPopovers();if($('graph-world'))fit();}
  return;
 }
 if(event.data.type!=='context')return;
 const data=event.data;analysisContext=data;syncMappingMetricContext();
 document.querySelector('.legend').hidden=data.legend===false;
 if(data.palette){if(data.palette.reference)document.documentElement.style.setProperty('--mapping-reference-bg',data.palette.reference);if(data.palette.target)document.documentElement.style.setProperty('--mapping-target-bg',data.palette.target);document.documentElement.style.setProperty('--host-canvas',data.palette.canvas);document.documentElement.style.setProperty('--host-list',data.palette.list);document.documentElement.style.setProperty('--host-scroll-thumb',data.palette.scrollThumb);document.documentElement.style.setProperty('--heat-low',data.palette.low);document.documentElement.style.setProperty('--heat-high',data.palette.high);}executionStage=data.stage==='prefill'?'prefill':'decode';
 document.documentElement.dataset.theme=data.theme==='dark'?'dark':'light';
 window.GEMMA_METRIC_DEMO={values:{}, stage:executionStage, summary:data.summary==='min'?'min':'max',layers:{decoder_stack:data.layers||[]},color:value=>data.colors?.[String(value)]||{bgColor:'transparent',textColor:'var(--muted)'},format:value=>data.formatted?.[String(value)]||String(value)};
 modelTree?.refresh();if(mappingState.active){if(mappingState.context.stage!=='any'&&mappingState.context.stage!==executionStage){openMapping(mappingState.context.anchor);return;}syncMapping();renderMappingDetails();return;}if(state.page==='layer')activateLayer(state.layer);if(overviewState.page!=='model'||state.page==='layer'){draw();details();}
});
parent.postMessage({channel:analysisChannel,type:'ready'},location.origin);

modelTree=window.createModelTree({model:()=>selectedModel,layer:i=>{if(state.page==='layer'&&state.layer===i){state.selection=null;draw();details();}else navigatePage('layer',i);},arch:(key,index=0)=>navigateOverview(key,index),inspect:(name,attrs)=>{if(mappingState.active)closeMapping();$('details').innerHTML=infoSection('module','Module info',infoTable([['name',name],...Object.entries(attrs)]));setDetailsOpen(true);requestAnimationFrame(measureInfoValues);}});
$('modules-toggle').onclick=()=>{const open=$('workspace').classList.toggle('show-model-tree');$('modules-toggle').setAttribute('aria-expanded',String(open));};
Promise.all([document.fonts.load('400 11px "Google Sans Text"'),document.fonts.load('500 11px "Google Sans Text"'),document.fonts.load('700 11px "Google Sans Text"')]).then(()=>{if(selectedModel==='gemma')modelTree.start();else{draw();details();}});
})();
</script></html>
