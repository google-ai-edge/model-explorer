[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-explorer-debugger"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "safetensors>=0.8,<1", "ml_dtypes>=0.5,<1", "model-debugger-contracts==0.1.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psutil>=5.9,<8", "sentencepiece>=0.2,<1"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]
apple = ["websockets>=15,<17", "flatbuffers>=25,<26"]

[tool.setuptools.packages.find]
where = ["package"]

[tool.setuptools.package-data]
"model_explorer_debugger.runtime" = ["*.json"]
