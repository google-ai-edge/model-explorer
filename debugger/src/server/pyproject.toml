[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-debugger-server"
version = "0.0.0"
description = "The Server of the Model Debugger."
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.84,<2",
  "jsonschema>=4.23,<5",
  "numpy>=2,<3",
  "protobuf>=6,<8",
  "safetensors>=0.6,<1",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
# grpcio-tools compiles the protocol's .proto into src/model_debugger/v1.
proto = [
  "grpcio-tools>=1.84,<2",
]
test = [
  "grpcio-tools>=1.84,<2",
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
model-debugger-server = "model_debugger_server.main:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 80
indent-width = 2
extend-exclude = ["src/model_debugger"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
pydocstyle.convention = "google"

[tool.ruff.format]
quote-style = "single"
