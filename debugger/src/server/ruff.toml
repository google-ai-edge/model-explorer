# ruff, the Python linter and formatter, in Google style:
#   bazel run //:ruff -- check "${PWD}/model_debugger"
line-length = 80
indent-width = 4

[lint]
select = ["E", "F", "I", "D"]
pydocstyle.convention = "google"
# The protocol's model_debugger.protocol comes from @protocol, not from this
# directory, but it is this repository's code too.
isort.known-first-party = ["model_debugger"]

[format]
quote-style = "single"
