[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_edge_debugger_pytorch"
version = "0.2.0"
description = "AI Edge Debugger PyTorch tensor capture hooks and exporter"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "The AI Edge Model Explorer Authors" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
]

[tool.setuptools]
packages = ["ai_edge_debugger_pytorch"]

[tool.setuptools.package-dir]
ai_edge_debugger_pytorch = "package/ai_edge_debugger_pytorch"
